name: Verify

on: [pull_request]

concurrency:
  group: verify-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Use Java 25 (required by firebase-tools emulators)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Get cache settings
        id: cache-settings
        run: |
          fbToolsVersion=$(npm pkg get devDependencies.firebase-tools | tr -d '"')
          echo "firebase-tools version $fbToolsVersion"
          echo "firebase-tools=$fbToolsVersion" >> $GITHUB_OUTPUT

      - name: Cache Firebase Emulator Binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-${{ matrix.node-version }}-firebase-${{ steps.cache-settings.outputs.firebase-tools }}

      - name: Install Dependencies
        run: npm ci

      - name: Check For Lint
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Run Unit Tests + Coverage
        run: npm run test:cov

      - name: Upload Test Coverage
        uses: codecov/codecov-action@v7
        if: matrix.node-version == '24.x'
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run Build
        run: npm run build

      - name: Size Check
        uses: andresz1/size-limit-action@v1
        if: matrix.node-version == '24.x'
        env:
          CI_JOB_NUMBER: 1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: npm
          skip_step: install # Skip install since it happens above
